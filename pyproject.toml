[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-statistical-classifier"
version = "0.1.0"
description = "A custom ML based image classifier model developed through iterative experimentation"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy",
    "matplotlib",
    "opencv-python",
    "scikit-learn",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "mnists",
]
